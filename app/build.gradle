plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-kapt'
}

def protonCore = "34.3.0"

// Release signing is driven by an untracked keystore.properties at the repo root (see
// .gitignore + keystore.properties.example). This keeps the private keystore and its passwords out
// of version control. When the file is missing (fresh clone / CI without secrets) we fall back to
// debug signing below so the project still builds — but such an APK is debug-signed and must NOT be
// distributed.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.saveory.frontwidget'
    compileSdk 35

    defaultConfig {
        applicationId "com.saveory.frontwidget"
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName "1.1.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // OpenWeather key is no longer hardcoded in source. It comes from a git-ignored
        // local.properties entry (OPEN_WEATHER_API_KEY=...) or the OPEN_WEATHER_API_KEY env var;
        // it is empty in a fresh clone / CI without the secret.
        def owProps = new Properties()
        def owPropsFile = rootProject.file("local.properties")
        if (owPropsFile.exists()) { owPropsFile.withInputStream { owProps.load(it) } }
        def owKey = (owProps['OPEN_WEATHER_API_KEY']
                ?: project.findProperty("OPEN_WEATHER_API_KEY")
                ?: System.getenv("OPEN_WEATHER_API_KEY") ?: "")
        buildConfigField "String", "OPEN_WEATHER_API_KEY", "\"${owKey}\""
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // Use the real release key when keystore.properties is present; otherwise fall back to
            // the debug key so the build doesn't break (that output is NOT distributable).
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Proton's libgojni.so ships for 4 ABIs (~53 MB). For local dev we only bundle the two we
            // actually install onto: arm64-v8a (physical phones like the Xperia) and x86_64 (the
            // emulator), which keeps the debug APK small while running on both. Release stays universal.
            ndk {
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    
    // Jetpack Glance
    implementation "androidx.glance:glance-appwidget:1.1.1"
    implementation "androidx.glance:glance-material3:1.1.1"

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Encrypted storage for the on-device Monarch session (token + device-uuid, or cookies).
    // Independent of the Kotlin/Compose/Hilt toolchain, so it does not touch the Proton stack.
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Play Services - Fused Location Provider
    implementation "com.google.android.gms:play-services-location:21.3.0"

    // Hilt / Dagger
    implementation 'com.google.dagger:hilt-android:2.49'
    kapt 'com.google.dagger:hilt-android-compiler:2.49'
    implementation 'androidx.hilt:hilt-work:1.2.0'
    kapt 'androidx.hilt:hilt-compiler:1.2.0'

    // Room (for the Proton account/user/key/crypto store)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Serialization + logging used by Proton Core
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // ---- Proton Core (full native client) ----
    implementation "me.proton.core:account:$protonCore"
    implementation "me.proton.core:account-manager:$protonCore"
    implementation "me.proton.core:account-recovery:$protonCore"
    implementation "me.proton.core:auth:$protonCore"
    implementation "me.proton.core:auth-fido:$protonCore"
    implementation "me.proton.core:biometric:$protonCore"
    implementation "me.proton.core:challenge:$protonCore"
    implementation "me.proton.core:challenge-presentation:$protonCore"
    implementation "me.proton.core:contact:$protonCore"
    implementation "me.proton.core:country:$protonCore"
    implementation "me.proton.core:crypto:$protonCore"
    implementation "me.proton.core:crypto-validator:$protonCore"
    implementation "me.proton.core:data:$protonCore"
    implementation "me.proton.core:data-room:$protonCore"
    implementation "me.proton.core:device-migration:$protonCore"
    implementation "me.proton.core:domain:$protonCore"
    implementation "me.proton.core:event-manager:$protonCore"
    implementation "me.proton.core:feature-flag:$protonCore"
    implementation "me.proton.core:human-verification:$protonCore"
    implementation "me.proton.core:key:$protonCore"
    implementation "me.proton.core:key-transparency:$protonCore"
    implementation "me.proton.core:mail-settings:$protonCore"
    implementation "me.proton.core:network:$protonCore"
    implementation "me.proton.core:notification:$protonCore"
    implementation "me.proton.core:observability:$protonCore"
    implementation "me.proton.core:pass-validator:$protonCore"
    implementation "me.proton.core:payment:$protonCore"
    implementation "me.proton.core:payment-iap:$protonCore"
    implementation "me.proton.core:plan:$protonCore"
    implementation "me.proton.core:presentation:$protonCore"
    implementation "me.proton.core:presentation-compose:$protonCore"
    implementation "me.proton.core:push:$protonCore"
    implementation "me.proton.core:telemetry:$protonCore"
    implementation "me.proton.core:user:$protonCore"
    implementation "me.proton.core:user-recovery:$protonCore"
    implementation "me.proton.core:user-settings:$protonCore"
    implementation "me.proton.core:util-android-dagger:$protonCore"
    implementation "me.proton.core:util-kotlin:$protonCore"
    implementation "me.proton.core:configuration-data:$protonCore"
    implementation "me.proton.core:proguard-rules:$protonCore"

    // Proton Go crypto bindings (GopenPGP v2.9.0-proton.1 + go-srp v0.0.7), vendored AAR.
    // Required at runtime by crypto-android for PGP + SRP; not published to Maven.
    implementation(name: 'gopenpgp', ext: 'aar')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.06.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
