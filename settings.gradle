pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Proton's Go crypto bindings (gopenpgp + go-srp) ship only as a prebuilt AAR,
        // not via Maven. Vendored in app/libs and consumed through flatDir.
        flatDir { dirs "$rootDir/app/libs" }
    }
}
rootProject.name = "FrontWidget"
include ':app'
